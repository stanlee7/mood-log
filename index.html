<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 감정 기록</title>
  
  <!-- Favicon Icon -->
  <link rel="icon" type="image/png" href="./public/emotions/01_happy_행복.png" />
  <link rel="apple-touch-icon" href="./public/emotions/01_happy_행복.png" />

  <!-- SEO & Share Preview Meta Tags -->
  <meta name="description" content="하루 한 번, 오늘의 기분을 기록해보세요" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="오늘의 감정 기록" />
  <meta property="og:description" content="하루 한 번, 오늘의 기분을 기록해보세요" />
  <meta property="og:image" content="./public/emotions/01_happy_행복.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="오늘의 감정 기록" />
  <meta name="twitter:description" content="하루 한 번, 오늘의 기분을 기록해보세요" />
  <meta name="twitter:image" content="./public/emotions/01_happy_행복.png" />

  <!-- Pretendard Font CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- FontAwesome for subtle icon touch -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <div class="card">
      <!-- ① 상단 타이틀 -->
      <header class="app-header">
        <h1 class="app-title">오늘의 감정 기록</h1>
        <p class="app-subtitle">기분을 고르고, 한 줄만 남겨보세요</p>
      </header>

      <!-- ② 가운데 큰 감정 표시 영역 -->
      <section id="emotion-display-area" class="emotion-display-area" aria-label="선택된 감정 표시 영역">
        <div class="placeholder-box">
          <p class="placeholder-text-main">아직 고른 감정이 없어요</p>
          <p class="placeholder-text-sub">아래에서 오늘의 기분을 골라주세요</p>
        </div>
      </section>

      <!-- ③ 감정 선택 버튼 가로 한 줄 -->
      <section class="emotion-selection-section">
        <div class="emotion-button-group">
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="happy" aria-label="행복">
              <img src="./public/emotions/01_happy_행복.png" alt="행복" />
            </button>
            <span class="emotion-label">행복</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="calm" aria-label="평온">
              <img src="./public/emotions/02_calm_평온.png" alt="평온" />
            </button>
            <span class="emotion-label">평온</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="normal" aria-label="보통">
              <img src="./public/emotions/03_normal_보통.png" alt="보통" />
            </button>
            <span class="emotion-label">보통</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="sad" aria-label="우울">
              <img src="./public/emotions/04_sad_우울.png" alt="우울" />
            </button>
            <span class="emotion-label">우울</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="angry" aria-label="화남">
              <img src="./public/emotions/05_angry_화남.png" alt="화남" />
            </button>
            <span class="emotion-label">화남</span>
          </div>
        </div>
      </section>

      <!-- ④ 한 줄 기록을 적는 입력 폼 -->
      <section class="note-input-section">
        <label for="mood-note" class="section-label">오늘 어떤 하루였나요?</label>
        <div class="input-wrapper">
          <textarea 
            id="mood-note" 
            class="mood-textarea" 
            placeholder="예) 오랜만에 산책했더니 기분이 가벼워졌다"
            rows="3"
            maxlength="60"
          ></textarea>
          <span class="char-count" id="char-count">0 / 60</span>
        </div>
      </section>

      <!-- ⑤ 저장 버튼 -->
      <footer class="action-footer">
        <button type="button" class="save-btn" id="save-btn" disabled>
          <span>기록 저장</span>
        </button>
        <p class="save-helper-text" id="save-helper">감정을 먼저 고르면 저장할 수 있어요</p>
      </footer>

      <!-- ⑥ 지난 기록 히스토리 목록 (최신순) -->
      <section class="history-section">
        <h2 class="history-title">지난 기록</h2>
        <div id="history-list" class="history-list">
          <!-- app.js에서 최신순으로 동적 렌더링 -->
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
