<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 감정 기록</title>
  
  <!-- Favicon Icon -->
  <link rel="icon" type="image/png" href="./public/emotions/01_happy_행복.png" />
  <link rel="apple-touch-icon" href="./public/emotions/01_happy_행복.png" />

  <!-- SEO & Share Preview Meta Tags -->
  <meta name="description" content="하루 한 번, 오늘의 기분을 기록해보세요" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="오늘의 감정 기록" />
  <meta property="og:description" content="하루 한 번, 오늘의 기분을 기록해보세요" />
  <meta property="og:image" content="./public/emotions/01_happy_행복.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="오늘의 감정 기록" />
  <meta name="twitter:description" content="하루 한 번, 오늘의 기분을 기록해보세요" />
  <meta name="twitter:image" content="./public/emotions/01_happy_행복.png" />

  <!-- Pretendard Font CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- FontAwesome for subtle icon touch -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <div class="card">
      <!-- ① 상단 오늘 날짜 (클릭 시 표시되는 버튼 형식) -->
      <header class="date-header">
        <button type="button" id="date-toggle-btn" class="date-header-btn" aria-expanded="false">
          <span class="date-icon"><i class="fa-regular fa-calendar"></i></span>
          <span id="date-placeholder" class="date-placeholder">오늘 날짜 보기</span>
          <h1 id="current-date" class="date-text hidden"></h1>
        </button>
      </header>

      <!-- ② 가운데 큰 감정 표시 영역 (비워둠) -->
      <section id="emotion-display-area" class="emotion-display-area" aria-label="선택된 감정 표시 영역">
        <div class="placeholder-box">
          <span class="placeholder-icon"><i class="fa-regular fa-face-smile"></i></span>
          <p class="placeholder-text">오늘의 감정을 선택해보세요</p>
        </div>
      </section>

      <!-- ③ 감정 선택 버튼 가로 한 줄 -->
      <section class="emotion-selection-section">
        <p class="section-label">오늘 기분은 어땠나요?</p>
        <div class="emotion-button-group">
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="happy" aria-label="아주 좋음">
              <img src="./public/emotions/01_happy_행복.png" alt="아주 좋음" />
            </button>
            <span class="emotion-label">아주 좋음</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="calm" aria-label="좋음">
              <img src="./public/emotions/02_calm_평온.png" alt="좋음" />
            </button>
            <span class="emotion-label">좋음</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="normal" aria-label="보통">
              <img src="./public/emotions/03_normal_보통.png" alt="보통" />
            </button>
            <span class="emotion-label">보통</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="sad" aria-label="나쁨">
              <img src="./public/emotions/04_sad_우울.png" alt="나쁨" />
            </button>
            <span class="emotion-label">나쁨</span>
          </div>
          <div class="emotion-item">
            <button type="button" class="emotion-btn" data-emotion="angry" aria-label="아주 나쁨">
              <img src="./public/emotions/05_angry_화남.png" alt="아주 나쁨" />
            </button>
            <span class="emotion-label">아주 나쁨</span>
          </div>
        </div>
      </section>

      <!-- ④ 한 줄 기록을 적는 입력 폼 자리 -->
      <section class="note-input-section">
        <label for="mood-note" class="section-label">오늘 하루를 한 줄로 기록해 보세요</label>
        <div class="input-wrapper">
          <textarea 
            id="mood-note" 
            class="mood-textarea" 
            placeholder="오늘 이 감정을 느낀 순간을 한 줄로 적어보세요"
            rows="3"
            maxlength="100"
          ></textarea>
          <span class="char-count" id="char-count">0 / 100</span>
        </div>
      </section>

      <!-- ⑤ 맨 아래 저장 버튼 자리 -->
      <footer class="action-footer">
        <button type="button" class="save-btn" id="save-btn" disabled>
          <span>기록 저장하기</span>
        </button>
      </footer>

      <!-- ⑥ 기록된 감정 히스토리 목록 (최신순) -->
      <section class="history-section">
        <h2 class="history-title"><i class="fa-solid fa-clock-rotate-left"></i> 감정 기록 모아보기</h2>
        <div id="history-list" class="history-list">
          <!-- app.js에서 최신순으로 동적 렌더링 -->
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
